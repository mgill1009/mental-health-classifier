# ── tfidf/hpa.yaml ────────────────────────────────────────────────────────
# HorizontalPodAutoscaler for the TF-IDF deployment.
#
# Auto-scaling metric:
#   • Primary:   CPU utilisation (target 60%)
#   • Secondary: RPS via custom metric (optional — requires metrics-server)
#
# Observable outcomes for the project evaluation:
#   • Current replica count:  kubectl get hpa -n mh-classifier -w
#   • Scale-up event timing:  kubectl describe hpa tfidf-hpa -n mh-classifier
#   • Pod count over time:    captured by Locust + Cloud Monitoring
#
# Scale-up latency metric (answers professor's auto-scaling question):
#   Time from first CPU spike above 60% threshold until new pod is Ready
#   and receiving traffic. Typically 30–90s on GKE Standard.
# ─────────────────────────────────────────────────────────────────────────

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tfidf-hpa
  namespace: mh-classifier
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tfidf-deployment

  minReplicas: 2
  maxReplicas: 10

  metrics:
    # Primary signal: CPU utilisation
    # TF-IDF inference is synchronous and CPU-bound — this is the right signal.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60    # scale up when avg pod CPU > 60%

    # Secondary signal: memory (guard against memory leaks or large batches)
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30     # react quickly to bursts
      policies:
        - type: Pods
          value: 3                        # add up to 3 pods per scale event
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180    # wait 3 min before scaling down
      policies:
        - type: Pods
          value: 1                        # remove 1 pod at a time
          periodSeconds: 60
