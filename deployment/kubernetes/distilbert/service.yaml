# ── distilbert/service.yaml ───────────────────────────────────────────────

apiVersion: v1
kind: Service
metadata:
  name: distilbert-service
  namespace: mh-classifier
  labels:
    app: distilbert-service
    model: distilbert
spec:
  type: ClusterIP
  selector:
    app: distilbert-service
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
